name: Pylint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
    pylint:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.10"

        - name: Set up uv
          uses: astral-sh/setup-uv@v5

        - name: Install dependencies
          run: uv sync

        - name: Run pylint
          run: uv run pylint src